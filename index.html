<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shaft Demo</title>

<style>
body {
  margin: 0;
  background: #0f172a;
  display: grid;
  place-items: center;
  color: white;
  font-family: Arial;
}

.scene {
  width: 900px;
  min-height: 600px;
  text-align: center;
}

.machine {
  position: relative;
  height: 300px;
}

.motor {
  position: absolute;
  left: 50px;
  top: 100px;
  width: 200px;
  height: 100px;
  border-radius: 50px;
  background: #3b82a0;
}

.pump {
  position: absolute;
  right: 50px;
  top: 90px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: #3b82a0;
}

.shaft {
  position: absolute;
  top: 140px;
  height: 14px;
  background: #94a3b8;
}

.left { left: 250px; width: 150px; }
.right { left: 500px; width: 150px; }

.coupling {
  position: absolute;
  left: 400px;
  top: 120px;
  display: flex;
}

.coupling div {
  width: 20px;
  height: 50px;
  background: yellow;
  margin: 2px;
}

.machine.misaligned .right {
  transform: translateY(20px);
}

button {
  margin-top: 20px;
  padding: 10px 20px;
}
</style>
</head>

<body>

<div class="scene">
  <h2>Motor → Coupling → Pump</h2>

  <div class="machine" id="machine">
    <div class="motor"></div>

    <div class="shaft left"></div>

    <div class="coupling">
      <div></div><div></div><div></div>
    </div>

    <div class="shaft right"></div>

    <div class="pump"></div>
  </div>

  <button onclick="toggle()">Toggle misalignment</button>
</div>

<script>
function toggle() {
  document.getElementById("machine").classList.toggle("misaligned");
}
</script>

</body>
</html>

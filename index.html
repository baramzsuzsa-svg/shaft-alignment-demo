<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shaft Alignment</title>

<style>
body {
  margin: 0;
  background: #0f172a;
  color: white;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.container {
  width: 1100px;
  min-height: 700px;
  padding: 40px 0;
}

/* PANEL */
.panel {
  position: relative;
  height: 260px;
  margin-bottom: 60px;
  border-radius: 12px;
  padding: 20px;
}

.aligned {
  border: 2px solid #22c55e;
}

.misaligned {
  border: 2px solid #ef4444;
}

/* LABEL */
.label {
  font-weight: bold;
  margin-bottom: 10px;
}

.aligned .label { color: #22c55e; }
.misaligned .label { color: #ef4444; }

/* MACHINE */
.machine {
  position: relative;
  height: 200px;
}

/* CENTERLINE */
.centerline {
  position: absolute;
  top: 100px;
  left: 120px;
  right: 120px;
  border-top: 2px dashed;
}

.aligned .centerline { border-color: #22c55e; }
.misaligned .centerline { border-color: #ef4444; }

/* MOTOR */
.motor {
  position: absolute;
  left: 50px;
  top: 60px;
  width: 180px;
  height: 80px;
  border-radius: 40px;
  background: linear-gradient(#3b82f6, #1e293b);
}

/* PUMP */
.pump {
  position: absolute;
  right: 50px;
  top: 50px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, #3b82f6, #1e293b);
}

/* SHAFT */
.shaft {
  position: absolute;
  top: 96px;
  height: 8px;
  background: #94a3b8;
}

.left { left: 230px; width: 200px; }
.right { left: 560px; width: 200px; }

/* COUPLING */
.coupling {
  position: absolute;
  left: 430px;
  top: 80px;
  display: flex;
  gap: 4px;
}

.block {
  width: 20px;
  height: 40px;
  background: #facc15;
}

/* MISALIGNMENT EFFECT */
.misaligned .right {
  transform: translateY(15px) rotate(3deg);
}

.misaligned .coupling {
  animation: shake 0.3s infinite;
}

.misaligned .block {
  background: #ef4444;
}

@keyframes shake {
  0% { transform: translateY(0); }
  50% { transform: translateY(5px); }
  100% { transform: translateY(0); }
}

/* TEXT */
.desc {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.8;
}

</style>
</head>

<body>

<div class="container">

  <!-- ALIGNED -->
  <div class="panel aligned">
    <div class="label">✔ ALIGNED</div>

    <div class="machine">
      <div class="centerline"></div>

      <div class="motor"></div>

      <div class="shaft left"></div>

      <div class="coupling">
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
      </div>

      <div class="shaft right"></div>

      <div class="pump"></div>
    </div>

    <div class="desc">
      Centerlines match → smooth power transmission, no excessive wear.
    </div>
  </div>


  <!-- MISALIGNED -->
  <div class="panel misaligned">
    <div class="label">✖ MISALIGNED</div>

    <div class="machine">
      <div class="centerline"></div>

      <div class="motor"></div>

      <div class="shaft left"></div>

      <div class="coupling">
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
      </div>

      <div class="shaft right"></div>

      <div class="pump"></div>
    </div>

    <div class="desc">
      Misalignment → coupling flexes every rotation → vibration, heat, wear.
    </div>
  </div>

</div>

</body>
</html>
